{% macro emulator(virus, enabled) -%}

{% if enabled %}
<div class="retro-computer">
    <div class="retro-computer__holder">
        <iframe style="border-radius:5px;background-color:white" src="museum/hatari.html" scrolling="auto" marginwidth="0" marginheight="0" width="752" height="504" frameBorder="1" loading="lazy"></iframe>
    </div>
</div>
{% else %}
<div class="retro-computer">
    <div class="retro-computer__holder">
        <img src="/gallery/viruses/{{virus.lower()}}.png">
    </div>
</div>
{% endif %}

{%- endmacro %}
